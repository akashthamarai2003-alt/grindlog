<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body, html { margin: 0; padding: 0; height: 100%; }
  .scroll-container {
    height: 100vh;
    overflow-y: auto;
    position: relative;
    background: #333;
  }
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sticky-bg {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    background: url('https://via.placeholder.com/800x1200?text=Background') center/cover;
    z-index: 0;
  }
  .content {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    margin-top: -100vh; /* Pull content up to overlap the sticky background */
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    /* Adding some extra height to test scrolling */
    padding-bottom: 500px; 
  }
  .card {
    background: rgba(255, 255, 255, 0.8);
    margin: 10px 0;
    padding: 20px;
    border-radius: 8px;
  }
</style>
</head>
<body>
<div class="scroll-container">
  <div class="page">
    <div class="sticky-bg"></div>
    <div class="content">
      <h1 style="color: red;">Header</h1>
      <div class="card">Item 1</div>
      <div class="card">Item 2</div>
      <div class="card">Item 3</div>
      <div class="card">Item 4</div>
      <div class="card">Item 5</div>
      <div class="card">Item 6</div>
      <div class="card">Item 7</div>
    </div>
  </div>
</div>
</body>
</html>
